name: Polygon editor PoC (Windows)

on:
  push:
    branches:
      - main
      - 'poc/**'
    paths:
      - 'proof-of-concepts/rust-polygon-editor/**'
      - '.github/workflows/rust-polygon-editor-poc.yml'
  pull_request:
    paths:
      - 'proof-of-concepts/rust-polygon-editor/**'
      - '.github/workflows/rust-polygon-editor-poc.yml'
  workflow_dispatch:

jobs:
  windows-test:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
      - name: Run geometry tests
        run: cargo test --manifest-path proof-of-concepts/rust-polygon-editor/Cargo.toml
      - name: Build the native polygon PoC
        run: cargo build --manifest-path proof-of-concepts/rust-polygon-editor/Cargo.toml
