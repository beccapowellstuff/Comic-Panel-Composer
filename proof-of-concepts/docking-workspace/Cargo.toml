[package]
name = "docking-workspace-poc"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
eframe = "=0.36.2"
egui = { version = "=0.36.2", features = ["serde"] }
egui_dock = { version = "=0.21.1", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

